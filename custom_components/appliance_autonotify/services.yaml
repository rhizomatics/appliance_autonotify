reset_maintenance:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: appliance_autonotify
    item:
      selector:
        text:
    cycles:
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          mode: box
snooze_maintenance:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: appliance_autonotify
    item:
      selector:
        text:
    days:
      default: 30
      selector:
        number:
          min: 0
          max: 365
          mode: box
