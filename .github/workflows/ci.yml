name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # weekly, so a change in what HACS or Home Assistant ask of an integration is found out here first
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # nothing ignored, the brand check being met by the brand directory of the integration
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check --diff

      - name: Codespell
        run: uv run codespell

      # against the locked, latest, Home Assistant, whose type hints are probatio's
      - name: mypy
        run: uv run mypy custom_components/appliance_autonotify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported, 6 months back, and the locked latest
        include:
          - ha-version: "2026.4"
            ha-override: "2026.4.*"
          - ha-version: "2026.10"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Install dependencies
        run: uv sync

      # the test harness has to move with it, as it is built against one HA release
      - name: Pin Home Assistant ${{ matrix.ha-version }}
        if: matrix.ha-override
        run: |
          uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" pytest-homeassistant-custom-component
          uv run --no-sync python -c "import homeassistant.const as c; v = c.__version__; print('Home Assistant', v); assert v.startswith('${{ matrix.ha-version }}.'), v"

      # --no-sync: a plain uv run would re-sync to the lock and undo the pin above
      - name: pytest
        run: uv run --no-sync pytest
