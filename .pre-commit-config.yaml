default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        args: [--unsafe]
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
     # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^(docs/developer/diagrams/.*|README\.[a-z]{2}(-[A-Za-z]+)?\.md|docs/[a-z]{2}(-[A-Za-z]+)?/.+\.md)$
        exclude_types: [csv, json]
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        args:
          - --quiet
        files: ^(custom_components)/.+\.py$
  # mypy from the project's own environment, so it type checks against the locked Home Assistant
  # (probatio since 2026.10) rather than a separately resolved set of stubs that drifts from it.
  # --frozen syncs the environment to uv.lock first, without re-locking: the exclude-newer window
  # moves daily, so a re-lock here would change uv.lock and fail the hook
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy --pretty --explicit-package-bases --show-error-codes --show-error-context
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: docgen/.*\.py
  - repo: local
    hooks:
      - id: diagram-thumbnails
        name: diagram thumbnails
        # needs Chrome and the archify skill under .agents/, as for editing the diagrams
        entry: node docgen/diagram_thumbnails.mjs
        language: system
        files: ^docs/developer/diagrams/.+\.html$
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.95
    hooks:
      - id: ty
        # docs group for docgen's bs4; --frozen as for mypy above
        args: [--frozen, --isolated, --no-python-downloads, --group, docs]
